# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6c0931730e90448ed6ea696b399d98a5"
name = "discount"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,write_metaobjects,write_metaobject_definitions,write_discounts"

[product.metafields.custom.volume_tiers]
type = "json"
name = "Volume Tiers"
description = "Per-product volume discount tiers. JSON array of { min_qty, discount_pct } objects. The highest matching tier (min_qty <= line.quantity) is applied at checkout as a line-level percentage discount."

  [product.metafields.custom.volume_tiers.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
