query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            volumeTiers: metafield(namespace: "custom", key: "volume_tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
